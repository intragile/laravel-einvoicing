name: tests

# Requires intragile/php-einvoicing and its rule packages on Packagist, and composer.json without
# the path repositories of local development: composer cannot resolve them before then.

on:
  push:
  pull_request:
  schedule:
    - cron: "37 4 * * 3"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
        laravel: ['12.*', '13.*']
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, gd, pcntl
          coverage: none
      - run: composer validate --strict
      - run: composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/einvoicing-rules install spain --dir=build/verifactu
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpunit --group verifactu-official --fail-on-skipped
        env:
          EINVOICING_VERIFACTU_SCHEMAS: build/verifactu
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/pint --test

  prefer-lowest:
    # Installs the lowest versions the constraints allow, so a lower bound that is too low fails
    # here. Composer skips releases with known security advisories, so each floor in composer.json
    # is kept at the lowest release this job can actually install.
    runs-on: ubuntu-latest
    name: PHP 8.3 / Laravel 12 / prefer-lowest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml, mbstring, gd, pcntl
          coverage: none
      - run: composer require "laravel/framework:12.*" --no-update --no-interaction
      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/einvoicing-rules install spain --dir=build/verifactu
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpunit --group verifactu-official --fail-on-skipped
        env:
          EINVOICING_VERIFACTU_SCHEMAS: build/verifactu

  databases:
    # Proves that concurrent writers never fork a VERI*FACTU chain on the server databases, and runs
    # the doctor's JSON path queries there (the tests job covers SQLite). Each URL names a throwaway
    # database; the test migrates it.
    runs-on: ubuntu-latest
    name: PHP 8.5 / Laravel 13 / MySQL + PostgreSQL
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: einvoicing
          MYSQL_DATABASE: einvoicing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -peinvoicing --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: einvoicing
          POSTGRES_PASSWORD: einvoicing
          POSTGRES_DB: einvoicing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U einvoicing -d einvoicing"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, libxml, mbstring, gd, pcntl, pdo_mysql, pdo_pgsql
          coverage: none
      - run: composer require "laravel/framework:13.*" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/einvoicing-rules install spain --dir=build/verifactu
      - run: vendor/bin/phpunit --colors=never --group verifactu-concurrency --group verifactu-databases --fail-on-skipped --fail-on-empty-test-suite
        env:
          EINVOICING_TEST_DB_URL: mysql://root:einvoicing@127.0.0.1:3306/einvoicing
      - run: vendor/bin/phpunit --colors=never --group verifactu-concurrency --group verifactu-databases --fail-on-skipped --fail-on-empty-test-suite
        env:
          EINVOICING_TEST_DB_URL: pgsql://einvoicing:einvoicing@127.0.0.1:5432/einvoicing

  next-versions:
    # Early warning against the next PHP release and the next Laravel major,
    # installed with minimum-stability dev. Static analysis and style are left to the jobs
    # above. A failure here does not fail the run, so check this job's result.
    # Laravel master has no branch alias, so the matching Testbench branch is named here;
    # bump both rows when a new PHP or Laravel version ships.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.7', laravel: '13.*', testbench: '*' }
          - { php: '8.6', laravel: 'dev-master', testbench: '12.x-dev' }
    name: Next / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    env:
      LARAVEL: ${{ matrix.laravel }}
      TESTBENCH: ${{ matrix.testbench }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, gd, pcntl
          coverage: none
      - name: Retarget composer.json at the upcoming versions
        run: |
          php -r '
            $c = json_decode(file_get_contents("composer.json"), true);
            foreach (["larastan/larastan", "phpstan/phpstan", "laravel/pint"] as $tool) {
                unset($c["require-dev"][$tool]);
            }
            if (isset($c["require-dev"]["orchestra/testbench"])) {
                $c["require-dev"]["orchestra/testbench"] = getenv("TESTBENCH") ?: "*";
            }
            $laravel = (string) getenv("LARAVEL");
            foreach (["require", "require-dev"] as $section) {
                foreach (array_keys($c[$section] ?? []) as $name) {
                    if ($laravel !== "" && ($name === "laravel/framework" || str_starts_with($name, "illuminate/"))) {
                        $c[$section][$name] = $laravel;
                    }
                }
            }
            $c["minimum-stability"] = "dev";
            $c["prefer-stable"] = true;
            file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          '
      - run: composer update --prefer-dist --no-interaction --no-progress --ignore-platform-req=php+
      - run: vendor/bin/einvoicing-rules install spain --dir=build/verifactu
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpunit --group verifactu-official --fail-on-skipped
        env:
          EINVOICING_VERIFACTU_SCHEMAS: build/verifactu
